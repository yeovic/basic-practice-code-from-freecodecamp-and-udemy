name: Compile custom MazeCave ARM64 launcher runtime (NO GAME DATA)
on:
  push:
    branches:
      - maze-android-runtime-build
    paths:
      - .github/workflows/maze-runtime-compile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout isolated CI branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout audited Winlator 11.2 source (NO MAZECAVE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream
          git -C upstream init -q
          git -C upstream fetch --depth=1 https://github.com/brunodev85/winlator-app.git a5449107f53493ef76c7461b1b8ee5e3dcf35982
          git -C upstream checkout --detach --force FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = a5449107f53493ef76c7461b1b8ee5e3dcf35982
          echo "SOURCE_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install official Android SDK command line tools, platform, NDK, CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl -fL --retry 3 --retry-delay 2 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o "$RUNNER_TEMP/android-commandlinetools.zip"
          mkdir -p "$RUNNER_TEMP/android-commandlinetools"
          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$RUNNER_TEMP/android-commandlinetools"
          mv "$RUNNER_TEMP/android-commandlinetools/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Extract verified game-free MazeCave source (never upload original game)
        shell: bash
        run: |
          set -euo pipefail
          echo '3b757e7368df2acc4fc9de1f6ed1c430b2db401d80c022088cd0a0f308ceb9af  android-runtime/maze-runtime-sources.xz.b64' | sha256sum -c -
          python3 - <<'PY'
          import base64,io,lzma,tarfile
          from pathlib import Path
          src=Path('android-runtime/maze-runtime-sources.xz.b64')
          archive=lzma.decompress(base64.b64decode(''.join(src.read_text().split())))
          out=Path('ci-builder')
          approved={
              'patch_winlator.py','runtime_manifest.py','build_runtime_shell.sh',
              'assemble_private_game_apk.py','assets/controls-7311.icp',
              'src/MazeCaveBootstrap.java','src/MazeCaveArchiveInstaller.java',
              'src/MazeCaveTouchMapper.java','src/MazeCaveTouchOverlay.java'
          }
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:') as tar:
              members=tar.getmembers()
              assert {m.name for m in members} == approved, 'unexpected source files in public build'
              for m in members:
                  assert m.isfile() and m.size<70000, 'unsafe source archive'
                  dest=out/m.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with tar.extractfile(m) as f: dest.write_bytes(f.read())
          assert not (out/'assets/game.zip').exists(), 'private MazeCave must not enter public CI'
          print('Audited no-game launcher sources extracted')
          PY
      - name: Compile patched Wine runtime with dedicated MazeCave touch launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x upstream/gradlew
          bash ci-builder/build_runtime_shell.sh upstream runtime-shell-only.apk
          test -s runtime-shell-only.apk
      - name: Verify actual Android APK contains source patches but NO GAME
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile,hashlib
          p='runtime-shell-only.apk'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              for key in ('AndroidManifest.xml','classes.dex','assets/rootfs.tzst',
                          'assets/mazecave/game.zip','assets/mazecave/controls-7311.icp',
                          'assets/mazecave/maze_build_manifest.json'):
                  assert key in names, 'Missing: '+key
              manifest=json.loads(z.read('assets/mazecave/maze_build_manifest.json'))
              assert manifest['payload_mode']=='runtime-shell'
              assert manifest['identity_mode']=='runtime-compatible'
              assert z.getinfo('assets/mazecave/game.zip').file_size<500
              assert any(x.startswith('lib/arm64-v8a/') and x.endswith('.so') for x in names)
          print('Customized MazeCave runtime shell built. This still has NO ORIGINAL GAME.')
          print('SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Upload compiled runtime shell (must combine privately with original game)
        uses: actions/upload-artifact@v4
        with:
          name: mazecave-custom-runtime-shell-NO-ORIGINAL-GAME
          path: runtime-shell-only.apk
          retention-days: 1
          if-no-files-found: error
