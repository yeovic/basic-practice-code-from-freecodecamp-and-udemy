name: Export Android signing tools for local PRIVATE APK assembly (NO GAME)
on:
  push:
    branches:
      - maze-android-runtime-build
    paths:
      - .github/workflows/maze-signing-tools.yml
permissions:
  contents: read
jobs:
  signing-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Google Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl -fL --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o "$RUNNER_TEMP/commandlinetools.zip"
          mkdir -p "$RUNNER_TEMP/clt"
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/clt"
          mv "$RUNNER_TEMP/clt/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install 'build-tools;35.0.0'
          SIGN="$SDK/build-tools/35.0.0"
          test -x "$SIGN/zipalign"
          test -f "$SIGN/lib/apksigner.jar"
          test -x "$SIGN/apksigner"
          mkdir -p output
          cp "$SIGN/zipalign" "$SIGN/apksigner" "$SIGN/aapt" output/
          mkdir -p output/lib
          cp "$SIGN/lib/apksigner.jar" output/lib/
          if [ -d "$SIGN/lib64" ]; then cp -a "$SIGN/lib64" output/; fi
          cp "$SIGN/source.properties" output/
          chmod +x output/zipalign output/apksigner output/aapt
          tar -czf android-35-signing-tools-linux.tar.gz -C output .
          sha256sum android-35-signing-tools-linux.tar.gz
      - name: Upload no-game signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android35-linux-official-signing-tools-no-game
          path: android-35-signing-tools-linux.tar.gz
          retention-days: 1
          if-no-files-found: error
