name: Velvet v3.9 Image Integrity QA
on:
  push:
    branches: [velvet-atelier-apk]
    paths:
      - '.github/workflows/velvet-v26-upscale-checks.yml'
      - 'velvet/ImageResampler.java'
      - 'velvet/ImageResamplerTest.java'
      - 'velvet/ImageUpscaleActivity.java'
      - 'velvet/VelvetHubActivity.java'
      - 'velvet/GuidedStudioActivity.java'
      - 'velvet/PromptBuilder.java'
      - 'velvet/PromptBuilderTest.java'
      - 'velvet/QualityTuning.java'
      - 'velvet/QualityTuningTest.java'
      - 'velvet/LongPromptPlanner.java'
      - 'velvet/LongPromptRunnerActivity.java'
      - 'velvet/NativeTokenBudget.java'
      - 'velvet/NativeTokenBudgetTest.java'
      - 'velvet/GenerationDimensions.java'
      - 'velvet/GenerationDimensionsTest.java'
      - 'velvet/NativePromptCompactor.java'
      - 'velvet/NativePromptCompactorTest.java'
      - 'velvet/RepairUndoPatch.java'
      - 'velvet/RepairUndoPatchTest.java'
      - 'velvet/RepairMask.java'
      - 'velvet/RepairMaskTest.java'
      - 'velvet/NativeBackendConfiguration.java'
      - 'velvet/NativeContextPolicy.java'
      - 'velvet/NativeContextPolicyTest.java'
      - 'velvet/ImageOrientationPolicy.java'
      - 'velvet/ImageOrientationLoader.java'
      - 'velvet/ImageOrientationPolicyTest.java'
      - 'velvet/NativeImageTransportPolicy.java'
      - 'velvet/NativeImageTransportPolicyTest.java'
      - 'velvet/FaceRepairStudioActivity.java'
      - 'velvet/FacePatchEngine.java'
      - 'velvet/FacePatchEngineTest.java'
      - 'velvet/RepairPromptTemplates.java'
      - 'velvet/GenerationPassPolicy.java'
      - 'velvet/GenerationPassPolicyTest.java'
      - 'velvet/RegionSelectionView.java'
      - 'velvet/LocalPerformanceLog.java'
      - 'velvet/PromptImportPolicy.java'
      - 'velvet/PromptImportPolicyTest.java'
      - 'velvet/IncludedModelProvider.java'
      - 'velvet/ModelDiagnostics.java'
      - 'velvet/ModelArtifactVerifier.java'
      - 'velvet/ModelArtifactVerifierTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java image-quality roundtrip checks
        run: |
          mkdir -p build/upscaleqa
          javac -d build/upscaleqa velvet/ModelArtifactVerifier.java velvet/ModelArtifactVerifierTest.java
          java -cp build/upscaleqa org.velvetatelier.ModelArtifactVerifierTest
          javac -d build/upscaleqa velvet/GenerationDimensions.java velvet/GenerationDimensionsTest.java
          java -cp build/upscaleqa org.velvetatelier.GenerationDimensionsTest
          javac -d build/upscaleqa velvet/NativePromptCompactor.java velvet/NativePromptCompactorTest.java
          java -cp build/upscaleqa org.velvetatelier.NativePromptCompactorTest
          javac -d build/upscaleqa velvet/RepairUndoPatch.java velvet/RepairUndoPatchTest.java velvet/FacePatchEngine.java
          java -cp build/upscaleqa org.velvetatelier.RepairUndoPatchTest
          javac -d build/upscaleqa velvet/NativeTokenBudget.java velvet/NativeTokenBudgetTest.java
          java -cp build/upscaleqa org.velvetatelier.NativeTokenBudgetTest
          javac -d build/upscaleqa velvet/GenerationPassPolicy.java velvet/GenerationPassPolicyTest.java
          java -cp build/upscaleqa org.velvetatelier.GenerationPassPolicyTest
          javac -d build/upscaleqa velvet/NativeContextPolicy.java velvet/NativeContextPolicyTest.java
          java -cp build/upscaleqa org.velvetatelier.NativeContextPolicyTest
          javac -d build/upscaleqa velvet/ImageOrientationPolicy.java velvet/ImageOrientationPolicyTest.java
          java -cp build/upscaleqa org.velvetatelier.ImageOrientationPolicyTest
          javac -d build/upscaleqa velvet/NativeImageTransportPolicy.java velvet/NativeImageTransportPolicyTest.java
          java -cp build/upscaleqa org.velvetatelier.NativeImageTransportPolicyTest
          javac -d build/upscaleqa velvet/RepairMask.java velvet/RepairMaskTest.java
          java -cp build/upscaleqa org.velvetatelier.RepairMaskTest
          javac -d build/upscaleqa velvet/FacePatchEngine.java velvet/FacePatchEngineTest.java velvet/RepairPromptTemplates.java
          java -cp build/upscaleqa org.velvetatelier.FacePatchEngineTest
          javac -d build/upscaleqa velvet/ImageResampler.java velvet/ImageResamplerTest.java
          java -cp build/upscaleqa org.velvetatelier.ImageResamplerTest
          javac -d build/upscaleqa velvet/QualityTuning.java velvet/PromptBuilder.java velvet/LongPromptPlanner.java velvet/PromptImportPolicy.java velvet/PromptImportPolicyTest.java
          java -cp build/upscaleqa org.velvetatelier.PromptImportPolicyTest
          javac -d build/upscaleqa velvet/QualityTuning.java velvet/LongPromptPlanner.java velvet/PromptBuilder.java velvet/PromptBuilderTest.java velvet/QualityTuningTest.java
          java -cp build/upscaleqa org.velvetatelier.QualityTuningTest
          java -cp build/upscaleqa org.velvetatelier.PromptBuilderTest
      - name: Android API compilation
        run: |
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$PLATFORM" -d build/upscaleqa \
            velvet/ModelStorage.java velvet/IncludedModelProvider.java \
            velvet/PixelEngine.java velvet/GifWriter.java \
            velvet/PixelStudioActivity.java velvet/VelvetHubActivity.java \
            velvet/PromptBuilder.java velvet/GuidedStudioActivity.java \
            velvet/QualityTuning.java velvet/LongPromptPlanner.java \
            velvet/LongPromptRunnerActivity.java velvet/NativeImageTransportPolicy.java \
            velvet/FaceRepairStudioActivity.java velvet/FacePatchEngine.java \
            velvet/RegionSelectionView.java velvet/RepairPromptTemplates.java \
            velvet/ImageOrientationPolicy.java velvet/ImageOrientationLoader.java \
            velvet/GenerationPassPolicy.java velvet/LocalPerformanceLog.java velvet/NativeTokenBudget.java velvet/NativePromptCompactor.java \
            velvet/RepairUndoPatch.java velvet/RepairMask.java velvet/NativeBackendConfiguration.java velvet/NativeContextPolicy.java velvet/GenerationDimensions.java \
            velvet/PromptImportPolicy.java \
            velvet/ImageResampler.java velvet/ImageUpscaleActivity.java \
            velvet/ModelDiagnostics.java velvet/ModelArtifactVerifier.java
          echo 'PASS: v3.9 EXIF correct selections, PNG native generation and Android compilation'