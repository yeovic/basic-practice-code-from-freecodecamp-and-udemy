name: Velvet v3.1 Native Face Repair QA
on:
  push:
    branches: [velvet-atelier-apk]
    paths:
      - '.github/workflows/velvet-v26-upscale-checks.yml'
      - 'velvet/ImageResampler.java'
      - 'velvet/ImageResamplerTest.java'
      - 'velvet/ImageUpscaleActivity.java'
      - 'velvet/VelvetHubActivity.java'
      - 'velvet/GuidedStudioActivity.java'
      - 'velvet/QualityTuning.java'
      - 'velvet/QualityTuningTest.java'
      - 'velvet/LongPromptPlanner.java'
      - 'velvet/LongPromptRunnerActivity.java'
      - 'velvet/FaceRepairStudioActivity.java'
      - 'velvet/FacePatchEngine.java'
      - 'velvet/FacePatchEngineTest.java'
      - 'velvet/IncludedModelProvider.java'
      - 'velvet/ModelDiagnostics.java'
      - 'velvet/ModelArtifactVerifier.java'
      - 'velvet/ModelArtifactVerifierTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java image-quality roundtrip checks
        run: |
          mkdir -p build/upscaleqa
          javac -d build/upscaleqa velvet/ModelArtifactVerifier.java velvet/ModelArtifactVerifierTest.java
          java -cp build/upscaleqa org.velvetatelier.ModelArtifactVerifierTest
          javac -d build/upscaleqa velvet/FacePatchEngine.java velvet/FacePatchEngineTest.java
          java -cp build/upscaleqa org.velvetatelier.FacePatchEngineTest
          javac -d build/upscaleqa velvet/ImageResampler.java velvet/ImageResamplerTest.java
          java -cp build/upscaleqa org.velvetatelier.ImageResamplerTest
          javac -d build/upscaleqa velvet/QualityTuning.java velvet/LongPromptPlanner.java velvet/PromptBuilder.java velvet/PromptBuilderTest.java velvet/QualityTuningTest.java
          java -cp build/upscaleqa org.velvetatelier.QualityTuningTest
          java -cp build/upscaleqa org.velvetatelier.PromptBuilderTest
      - name: Android API compilation
        run: |
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$PLATFORM" -d build/upscaleqa \
            velvet/ModelStorage.java velvet/IncludedModelProvider.java \
            velvet/PixelEngine.java velvet/GifWriter.java \
            velvet/PixelStudioActivity.java velvet/VelvetHubActivity.java \
            velvet/PromptBuilder.java velvet/GuidedStudioActivity.java \
            velvet/QualityTuning.java velvet/LongPromptPlanner.java \
            velvet/LongPromptRunnerActivity.java \
            velvet/FaceRepairStudioActivity.java velvet/FacePatchEngine.java \
            velvet/ImageResampler.java velvet/ImageUpscaleActivity.java \
            velvet/ModelDiagnostics.java velvet/ModelArtifactVerifier.java
          echo 'PASS: v3.1 face inpaint UI and quality pipeline Android source compilation'