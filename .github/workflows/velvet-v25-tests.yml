name: Velvet v2.5 Source Checks
on:
  push:
    branches: [velvet-atelier-apk]
    paths:
      - '.github/workflows/velvet-v25-tests.yml'
      - 'velvet/PromptBuilder.java'
      - 'velvet/PromptBuilderTest.java'
      - 'velvet/GuidedStudioActivity.java'
      - 'velvet/ModelStorage.java'
      - 'velvet/VelvetHubActivity.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pure Java regression
        run: |
          mkdir -p build/qa
          javac -d build/qa velvet/PromptBuilder.java velvet/PromptBuilderTest.java
          java -cp build/qa org.velvetatelier.PromptBuilderTest
      - name: Android API compilation
        run: |
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$PLATFORM" -d build/qa \
            velvet/ModelStorage.java velvet/IncludedModelProvider.java \
            velvet/PixelEngine.java velvet/GifWriter.java \
            velvet/PixelStudioActivity.java velvet/VelvetHubActivity.java \
            velvet/PromptBuilder.java velvet/GuidedStudioActivity.java
          echo 'PASS: Android Java compile'