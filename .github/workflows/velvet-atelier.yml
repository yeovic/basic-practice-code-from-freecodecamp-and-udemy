name: Build Velvet Atelier (noncommercial)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned source and Apktool
        run: |
          mkdir -p build dist
          curl -fL --retry 4 --retry-delay 2 "https://github.com/xororz/local-dream/releases/download/v2.8.1/LocalDream_armv8a_2.8.1.apk" -o build/base.apk
          echo "c8ba61769564ed13bcfb7e13cc48bb3bf6e3f9fd26db132a0bb2d6aa00a31edb  build/base.apk" | sha256sum -c -
          curl -fL --retry 4 --retry-delay 2 "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o build/apktool.jar
          java -Xmx3g -jar build/apktool.jar d --no-src --force build/base.apk -o build/decoded
      - name: Personal fork customizations and attribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape
          root=Path('build/decoded')
          path=root/'res/values/strings.xml'
          xml=path.read_text(encoding='utf-8')
          data={
            'app_name':'Velvet Atelier',
            'image_prompt':'Adult anime image prompt',
            'negative_prompt':'Negative prompt / exclusions',
            'generate_image':'Create image',
            'available_models':'Offline AI models',
            'no_results_hint':'Create original adult characters with a locally installed anime model.',
            'cpu_models':'On-device CPU / GPU models',
          }
          credits=('Velvet Atelier is an independent NONCOMMERCIAL personal fork of '
            'Local Dream by xororz and contributors. Original project: '
            'https://github.com/xororz/local-dream . '
            'License: Creative Commons Attribution-NonCommercial 4.0 '
            '(https://creativecommons.org/licenses/by-nc/4.0/). '
            'Modifications: app name, icon, palette, text and attribution. '
            'Original backend credits and third-party notices retained. '
            'No authorship of the upstream inference engine is claimed.')
          data['about_app']=credits
          for key,value in data.items():
            pattern=r'(<string\s+name="'+re.escape(key)+r'"(?:\s+[^>]*)?>).*?(</string>)'
            xml,count=re.subn(pattern,lambda m:m.group(1)+escape(value)+m.group(2),xml,count=1,flags=re.S)
            print(key, count)
            if key=='app_name' and count!=1:
              raise RuntimeError('Cannot patch app name; incompatible upstream resource layout')
          must=r'(<string\s+name="must_read"[^>]*>)(.*?)(</string>)'
          xml=re.sub(must,lambda m:m.group(1)+m.group(2)+r'\n\n'+escape(credits)+m.group(3),xml,count=1,flags=re.S)
          path.write_text(xml,encoding='utf-8')
          icon=root/'res/drawable/ic_launcher_foreground.xml'
          if icon.exists():
            icon.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#22152D" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#E8A5DE" android:pathData="M54,14C33,14 16,31 16,54C16,77 33,94 54,94C40,87 32,73 32,54C32,35 40,21 54,14Z"/>
            <path android:fillColor="#BC83EF" android:pathData="M60,18L66,42L90,48L66,54L60,78L54,54L30,48L54,42Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M83,18L86,27L95,30L86,33L83,42L80,33L71,30L80,27Z"/>
          </vector>''',encoding='utf-8')
          asset=root/'assets/VELVET_ATELIER_ATTRIBUTION.txt'
          asset.parent.mkdir(exist_ok=True)
          asset.write_text(credits+'\n',encoding='utf-8')
          PY
      - name: Rebuild, sign and validate APK
        run: |
          java -Xmx3g -jar build/apktool.jar b build/decoded -o build/unsigned.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -p -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -storetype PKCS12 -keystore build/personal.jks -storepass android -keypass android -alias velvet -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Velvet Atelier Personal Build, O=Personal Noncommercial, C=US" -noprompt
          "$TOOLS/apksigner" sign --ks build/personal.jks --ks-pass pass:android --ks-key-alias velvet --key-pass pass:android --out dist/Velvet_Atelier_Offline_Android_v1.apk build/aligned.apk
          "$TOOLS/apksigner" verify --verbose dist/Velvet_Atelier_Offline_Android_v1.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          p='dist/Velvet_Atelier_Offline_Android_v1.apk'
          with ZipFile(p) as z:
            files=z.namelist()
            assert 'classes.dex' in files
            assert any(x.endswith('.so') for x in files),'Native engine missing'
            assert 'assets/VELVET_ATELIER_ATTRIBUTION.txt' in files
          print('Verified full, locally capable Android app:',p)
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Velvet_Atelier_Offline_Android_v1
          path: dist/Velvet_Atelier_Offline_Android_v1.apk
          if-no-files-found: error
          retention-days: 30
